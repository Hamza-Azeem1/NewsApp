name: news_swipe
description: Vertical swipe news app with Firebase
publish_to: "none"

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  firebase_core: ^3.6.0
  cloud_firestore: ^5.4.4
  cached_network_image: ^3.3.1
  firebase_auth: ^5.3.1
  firebase_storage: ^12.3.0
  file_picker: ^8.1.2
  intl: ^0.19.0
  url_launcher: ^6.2.6
  webview_flutter: ^4.7.0
  shared_preferences: ^2.2.2
  connectivity_plus: ^6.0.0
  internet_connection_checker: ^1.0.0
  video_player: ^2.9.0
  youtube_player_iframe: ^5.2.2
  flutter_native_splash: ^2.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true

  assets:
    - assets/images/

# -------------------------------
# Flutter Launcher Icons Setup
# -------------------------------
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/app_icon.png"
  adaptive_icon_background: "#000000"
  adaptive_icon_foreground: "assets/images/app_icon.png"

# -------------------------------
# Flutter Native Splash Setup
# -------------------------------
flutter_native_splash:
  color: "#000000"                          # Match your app's splash background color
  image: assets/images/app_icon.png         # Your splash logo/image
  color_dark: "#000000"                     # Dark mode background
  image_dark: assets/images/app_icon.png    # Dark mode image

  # Android 12+ specific splash config
  android_12:
    color: "#000000"
    image: assets/images/app_icon.png
    color_dark: "#000000"
    image_dark: assets/images/app_icon.png
    icon_background_color: "#000000"
    icon_background_color_dark: "#000000"

  web: false                                # Set to true if you have a Flutter web app